<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms – Xansa Stay</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #eef1ee;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* ── Navbar (matches rest of site) ── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 200;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 5rem;
            background: white;
            border-bottom: 1px solid #e2e6e2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .logo { display: flex; align-items: center; height: 100%; }
        .logo img { height: 70px; width: auto; object-fit: contain; }
        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-links a { font-size: 0.875rem; font-weight: 600; color: #6b7e6d; text-decoration: none; transition: color 0.2s; }
        .nav-links a:hover { color: #3d5240; }
        .nav-right { display: flex; align-items: center; gap: 1rem; }

        .profile-dropdown-wrapper { position: relative; cursor: pointer; }
        .profile-trigger {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 12px; border-radius: 12px;
            border: 1px solid #e2e6e2; transition: background 0.2s;
        }
        .profile-trigger:hover { background: #f7f8f6; }
        .profile-info { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
        .profile-name { font-size: 0.875rem; font-weight: 600; color: #1c2b1e; }
        .profile-role { font-size: 0.7rem; color: #6b7e6d; }
        .profile-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: #c9a84c; border: 2px solid #3d5240;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; color: #3d5240; flex-shrink: 0;
        }
        .profile-dropdown {
            display: none; position: absolute; right: 0; top: calc(100% + 10px);
            background: white; border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.16);
            min-width: 210px; z-index: 9999; overflow: hidden;
            border: 1px solid #e2e6e2;
        }
        .profile-dropdown.show { display: block; }
        .dropdown-header {
            display: flex; align-items: center; gap: 12px;
            padding: 1rem 1.25rem; border-bottom: 1px solid #e2e6e2; background: #f7f8f6;
        }
        .dh-name { font-size: 0.9rem; font-weight: 600; }
        .dh-email { font-size: 0.75rem; color: #6b7e6d; margin-top: 2px; }
        .profile-dropdown a {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 1.25rem; font-size: 0.875rem; color: #1c2b1e;
            text-decoration: none; transition: background 0.2s;
        }
        .profile-dropdown a:hover { background: #f7f8f6; color: #3d5240; }
        .logout-link { color: #e24b4a !important; }
        .logout-link:hover { background: #fff5f5 !important; }

        /* ── Page Header ── */
        .page-header {
            background: #3d5240;
            padding: calc(84px + 2.5rem) 5rem 2.5rem;
        }
        .page-header .breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8125rem; color: rgba(255,255,255,0.55); margin-bottom: 1rem;
        }
        .page-header .breadcrumb a { color: rgba(255,255,255,0.7); text-decoration: none; }
        .page-header .breadcrumb a:hover { color: white; }
        .page-header .breadcrumb span { color: rgba(255,255,255,0.35); }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.75rem, 3vw, 2.5rem);
            color: white;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 0.9375rem; margin-top: 0.375rem; }

        /* ── Filters ── */
        .filter-bar {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1.5rem 2rem 0;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 10px 14px;
            border: 1.5px solid #e2e6e2;
            border-radius: 10px;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            background: white;
            color: #1c2b1e;
            outline: none;
        }
        .filter-bar input { flex: 1; min-width: 200px; }

        /* ── Grid ── */
        .rooms-layout {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1.5rem 2rem 5rem;
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .empty-state {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 3.5rem 2rem;
            text-align: center;
            color: #6b7e6d;
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 2.5rem; color: #c9d3ca; margin-bottom: 1rem; display: block; }

        /* ── Room Card ── */
        .room-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .room-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }

        .room-img-wrap { height: 200px; position: relative; overflow: hidden; background: #f0f0f0; }
        .room-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .room-badge {
            position: absolute; top: 12px; left: 12px;
            padding: 4px 12px; border-radius: 50px;
            font-size: 0.7rem; font-weight: 700;
        }
        .room-badge.available { background: #e6f4ea; color: #1a7f37; }
        .room-badge.booked     { background: #fdeded; color: #c0392b; }

        .heart-btn {
            position: absolute;
            top: 12px; right: 12px;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(4px);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.14);
            transition: transform 0.2s;
        }
        .heart-btn:hover { transform: scale(1.15); }
        .heart-btn.fav-active { background: #fdeded; }

        .room-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 10px; flex: 1; }

        .room-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #1c2b1e;
        }
        .room-number { font-size: 0.75rem; color: #9aaa9c; margin-top: -6px; }

        .room-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            padding: 3px 10px; border-radius: 50px; font-size: 0.7rem;
            font-weight: 600; background: rgba(61,82,64,0.08); color: #3d5240;
        }

        .room-desc {
            font-size: 0.8125rem; color: #6b7e6d; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .room-footer {
            margin-top: auto;
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 10px; border-top: 1px solid #eef1ee;
        }
        .room-price { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: #3d5240; }
        .room-price span { font-size: 0.75rem; font-weight: 400; color: #9aaa9c; }

        .btn-view {
            padding: 9px 18px; background: #3d5240; color: white;
            border: none; border-radius: 10px; font-size: 0.8125rem; font-weight: 700;
            text-decoration: none; transition: background 0.2s;
        }
        .btn-view:hover { background: #4a6350; }
        .btn-view.disabled { background: #c9d3ca; pointer-events: none; }
    </style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav th:replace="~{navbar :: navbar}"></nav>

<!-- ══ PAGE HEADER ══ -->
<div class="page-header">
    <div class="breadcrumb">
        <a href="/Homepage">Home</a>
        <span>›</span>
        <span style="color:rgba(255,255,255,0.8);">Rooms</span>
    </div>
    <h1>Our Rooms</h1>
    <p>Choose the perfect room for your stay.</p>
</div>

<!-- ══ FILTERS ══ -->
<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Room search..." oninput="filterRooms()">
    <select id="typeFilter" onchange="filterRooms()">
        <option value="">All Types</option>
        <option value="SINGLE">Single</option>
        <option value="DOUBLE">Double</option>
        <option value="SUITE">Suite</option>
        <option value="DORMITORY">Dormitory</option>
    </select>
    <select id="statusFilter" onchange="filterRooms()">
        <option value="">All Status</option>
        <option value="AVAILABLE">Available</option>
        <option value="BOOKED">Booked</option>
    </select>
</div>

<!-- ══ ROOMS GRID ══ -->
<div class="rooms-layout">
    <div class="rooms-grid" id="roomsGrid">

        <!-- Empty state -->
        <div class="empty-state" th:if="${rooms == null or rooms.empty}">
            <i class="fas fa-bed"></i>
            <p>No room has been added yet.</p>
        </div>

        <!-- Room cards -->
        <div class="room-card"
             th:each="room : ${rooms}"
             th:attr="data-name=${room.name},data-type=${room.roomType},data-status=${room.status}">

            <div class="room-img-wrap">
                <img th:if="${room.images != null and !room.images.empty}"
                     th:src="@{/api/rooms/image/{id}(id=${room.images[0].imageId})}"
                     th:alt="${room.name}">
                <img th:unless="${room.images != null and !room.images.empty}"
                     src="/images/room-deluxe.jpg" alt="Room">

                <span class="room-badge"
                      th:classappend="${room.status != null and room.status.name() == 'AVAILABLE'} ? 'available' : 'booked'"
                      th:text="${room.status != null and room.status.name() == 'AVAILABLE'} ? 'Available' : 'Booked'">
                    Available
                </span>

                <button class="heart-btn"
                        th:attr="data-roomid=${room.roomId}"
                        onclick="toggleFav(event, this)"
                        title="Add to favourites">🤍</button>
            </div>

            <div class="room-body">
                <div class="room-name" th:text="${room.name}">Room Name</div>
                <div class="room-number" th:text="'Room #' + ${room.roomNumber}">Room #101</div>

                <div class="room-tags">
                    <span class="tag" th:if="${room.roomType}" th:text="${room.roomType}">Type</span>
                    <span class="tag" th:if="${room.bedType}" th:text="${room.bedType}">Bed</span>
                    <span class="tag" th:if="${room.maxGuests}" th:text="'Max ' + ${room.maxGuests} + ' guests'">Guests</span>
                    <span class="tag" th:if="${room.areaSqm}" th:text="${room.areaSqm} + ' m²'">Area</span>
                </div>

                <p class="room-desc" th:if="${room.description}" th:text="${room.description}">
                    Description...
                </p>

                <div class="room-footer">
                    <div class="room-price">
                        ₹<span th:text="${#numbers.formatInteger(room.pricePerDay, 1, 'COMMA')}">0</span>
                        <span>/ night</span>
                    </div>

                    <a th:href="@{/rooms/{id}(id=${room.roomId})}"
                       class="btn-view"
                       th:classappend="${room.status != null and room.status.name() == 'BOOKED'} ? 'disabled' : ''"
                       th:text="${room.status != null and room.status.name() == 'BOOKED'} ? 'Booked' : 'View & Book'">
                        View &amp; Book
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function filterRooms() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const type   = document.getElementById('typeFilter').value;
        const status = document.getElementById('statusFilter').value;

        document.querySelectorAll('.room-card').forEach(card => {
            const name = (card.dataset.name || '').toLowerCase();
            const cType   = card.dataset.type   || '';
            const cStatus = card.dataset.status || '';

            const matchSearch = !search || name.includes(search);
            const matchType   = !type   || cType   === type;
            const matchStatus = !status || cStatus === status;

            card.style.display = (matchSearch && matchType && matchStatus) ? 'flex' : 'none';
        });
    }

    function toggleDropdown(event) {
        event.stopPropagation();
        const d = document.getElementById('profileDropdown');
        if (d) d.classList.toggle('show');
    }
    window.addEventListener('click', function(e) {
        if (!e.target.closest('.profile-dropdown-wrapper')) {
            const d = document.getElementById('profileDropdown');
            if (d) d.classList.remove('show');
        }
    });

    async function toggleFav(event, btn) {
        event.stopPropagation();
        event.preventDefault();
        const roomId = btn.getAttribute('data-roomid');
        try {
            const res  = await fetch('/api/favourites/toggle/' + roomId, { method: 'POST' });
            const data = await res.json();
            if (res.status === 401) {
                alert('Favourite ke liye pehle login karein!');
                window.location.href = '/login';
                return;
            }
            if (data.success) {
                btn.textContent = data.favourited ? '❤️' : '🤍';
                btn.classList.toggle('fav-active', data.favourited);
            }
        } catch (e) { console.error(e); }
    }

    async function checkFavourites() {
        const btns = document.querySelectorAll('.heart-btn');
        for (const btn of btns) {
            const roomId = btn.getAttribute('data-roomid');
            try {
                const res  = await fetch('/api/favourites/check/' + roomId);
                const data = await res.json();
                if (data.favourited) {
                    btn.textContent = '❤️';
                    btn.classList.add('fav-active');
                }
            } catch (e) {}
        }
    }
    document.addEventListener('DOMContentLoaded', checkFavourites);
</script>
</body>
</html>
