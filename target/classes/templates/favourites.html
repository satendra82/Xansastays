<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favourites – Xansa Stay</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            background: #eef1ee;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* ── Page Header (matches Rooms page) ── */
        .page-header {
            background: #3d5240;
            padding: calc(84px + 2.5rem) 5rem 2.5rem;
        }
        .page-header .breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8125rem; color: rgba(255,255,255,0.55); margin-bottom: 1rem;
        }
        .page-header .breadcrumb a { color: rgba(255,255,255,0.7); text-decoration: none; }
        .page-header .breadcrumb a:hover { color: white; }
        .page-header .breadcrumb span { color: rgba(255,255,255,0.35); }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.75rem, 3vw, 2.5rem);
            color: white;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 0.9375rem; margin-top: 0.375rem; }

        /* ── Grid ── */
        .favourites-layout {
            max-width: 1180px;
            margin: 0 auto;
            padding: 2rem 2rem 5rem;
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .empty-state {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 3.5rem 2rem;
            text-align: center;
            color: #6b7e6d;
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
        .empty-state a {
            display: inline-block; margin-top: 1rem; padding: 10px 24px;
            background: #3d5240; color: white; border-radius: 10px;
            text-decoration: none; font-weight: 600; font-size: 0.875rem;
        }

        /* ── Room Card (matches Rooms page) ── */
        .room-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .room-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }

        .room-img-wrap { height: 200px; position: relative; overflow: hidden; background: #f0f0f0; }
        .room-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .room-badge {
            position: absolute; top: 12px; left: 12px;
            padding: 4px 12px; border-radius: 50px;
            font-size: 0.7rem; font-weight: 700;
        }
        .room-badge.available { background: #e6f4ea; color: #1a7f37; }
        .room-badge.booked     { background: #fdeded; color: #c0392b; }

        .heart-btn {
            position: absolute;
            top: 12px; right: 12px;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(4px);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.14);
            transition: transform 0.2s, opacity 0.3s;
        }
        .heart-btn:hover { transform: scale(1.15); }

        .room-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 10px; flex: 1; }

        .room-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #1c2b1e;
        }
        .room-number { font-size: 0.75rem; color: #9aaa9c; margin-top: -6px; }

        .room-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            padding: 3px 10px; border-radius: 50px; font-size: 0.7rem;
            font-weight: 600; background: rgba(61,82,64,0.08); color: #3d5240;
        }

        .room-footer {
            margin-top: auto;
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 10px; border-top: 1px solid #eef1ee;
        }
        .room-price { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: #3d5240; }
        .room-price span { font-size: 0.75rem; font-weight: 400; color: #9aaa9c; }

        .btn-view {
            padding: 9px 18px; background: #3d5240; color: white;
            border: none; border-radius: 10px; font-size: 0.8125rem; font-weight: 700;
            text-decoration: none; transition: background 0.2s;
        }
        .btn-view:hover { background: #4a6350; }
    </style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav th:replace="~{navbar :: navbar}"></nav>

<!-- ══ PAGE HEADER ══ -->
<div class="page-header">
    <div class="breadcrumb">
        <a href="/Homepage">Home</a>
        <span>›</span>
        <span style="color:rgba(255,255,255,0.8);">Favourites</span>
    </div>
    <h1>My Favourites</h1>
    <p>Rooms you've saved for later.</p>
</div>

<!-- ══ FAVOURITES GRID ══ -->
<div class="favourites-layout">
    <div class="rooms-grid" id="favGrid">

        <!-- Empty state -->
        <div class="empty-state" id="favEmpty" th:if="${favoriteRooms == null or favoriteRooms.empty}">
            <span class="icon">🏨</span>
            <p>No favourites yet. Browse our rooms and tap the heart to save them here.</p>
            <a href="/rooms">Explore Rooms</a>
        </div>

        <!-- Favourite cards -->
        <div class="room-card" th:each="room : ${favoriteRooms}">

            <div class="room-img-wrap">
                <img th:if="${room.images != null and !room.images.empty}"
                     th:src="@{/api/rooms/image/{id}(id=${room.images[0].imageId})}"
                     th:alt="${room.name}">
                <img th:unless="${room.images != null and !room.images.empty}"
                     src="/images/room-deluxe.jpg" alt="Room">

                <span class="room-badge"
                      th:classappend="${room.status != null and room.status.name() == 'AVAILABLE'} ? 'available' : 'booked'"
                      th:text="${room.status != null and room.status.name() == 'AVAILABLE'} ? 'Available' : 'Booked'">
                    Available
                </span>

                <button class="heart-btn"
                        th:attr="data-roomid=${room.roomId}"
                        onclick="removeFav(event, this)"
                        title="Remove from favourites">❤️</button>
            </div>

            <div class="room-body">
                <div class="room-name" th:text="${room.name}">Room Name</div>
                <div class="room-number" th:text="'Room #' + ${room.roomNumber}">Room #101</div>

                <div class="room-tags">
                    <span class="tag" th:if="${room.roomType}" th:text="${room.roomType}">Type</span>
                    <span class="tag" th:if="${room.bedType}" th:text="${room.bedType}">Bed</span>
                    <span class="tag" th:if="${room.maxGuests}" th:text="'Max ' + ${room.maxGuests} + ' guests'">Guests</span>
                    <span class="tag" th:if="${room.areaSqm}" th:text="${room.areaSqm} + ' m²'">Area</span>
                </div>

                <div class="room-footer">
                    <div class="room-price">
                        ₹<span th:text="${#numbers.formatInteger(room.pricePerDay, 1, 'COMMA')}">0</span>
                        <span>/ night</span>
                    </div>
                    <a th:href="@{/rooms/{id}(id=${room.roomId})}" class="btn-view">View & Book</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function toggleDropdown(event) {
        event.stopPropagation();
        const d = document.getElementById('profileDropdown');
        if (d) d.classList.toggle('show');
    }
    window.addEventListener('click', function(e) {
        if (!e.target.closest('.profile-dropdown-wrapper')) {
            const d = document.getElementById('profileDropdown');
            if (d) d.classList.remove('show');
        }
    });

    async function removeFav(event, btn) {
        event.stopPropagation();
        event.preventDefault();
        const roomId = btn.getAttribute('data-roomid');
        const card = btn.closest('.room-card');

        try {
            await fetch('/api/favourites/toggle/' + roomId, { method: 'POST' });
        } catch (e) { console.error(e); }

        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.93)';
        setTimeout(() => {
            card.remove();
            const remaining = document.querySelectorAll('#favGrid .room-card');
            if (remaining.length === 0) {
                document.getElementById('favGrid').innerHTML =
                    '<div class="empty-state" id="favEmpty">' +
                    '<span class="icon">🏨</span>' +
                    '<p>No favourites yet. Browse our rooms and tap the heart to save them here.</p>' +
                    '<a href="/rooms">Explore Rooms</a>' +
                    '</div>';
            }
        }, 300);
    }
</script>
</body>
</html>
